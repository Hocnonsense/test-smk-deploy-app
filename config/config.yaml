samples: config/samples.tsv
units: config/units.tsv
ref:
  n_chromosomes: 25
  species: homo_sapiens
  release: 111
  build: GRCh38
  pangenome:
    activate: true
    source: hprc
    version: v1.1
primers:
  trimming:
    primers_fa1: ''
    primers_fa2: ''
    tsv: '11'
    library_length: 0
mutational_burden:
  activate: false
  mode:
  - curve
  - hist
  events:
  - somatic_tumor_low
  - somatic_tumor_medium
  - somatic_tumor_high
mutational_signatures:
  activate: false
  samples:
  - tumor
  events:
  - some_id
gene_coverage:
  min_avg_coverage: 5
report:
  activate: true
  max_read_depth: 250
  label_dependency:
    min_recurrence: 5
  stratify:
    activate: false
    by-column: condition
maf:
  activate: false
  primary_alias: tumor
calling:
  infer_genotypes: false
  atomize: false
  delly:
    activate: true
  freebayes:
    activate: true
  scenario: config/scenario.yaml
  filter:
    candidates: '''MODERATE'' in ANN[''IMPACT'']'
    impact_filter: '''HIGH'' in ANN[''IMPACT'']'
    gene_list_filter:
      aux-files:
        super_interesting_genes: config/super_interesting_genes.tsv
      expression: ANN['SYMBOL'] in AUX['super_interesting_genes']
  fdr-control:
    threshold: 0.05
    mode: local-smart
    retain-artifacts: false
    events:
      some_id:
        types:
        - variants
        - fusions
        labels:
          some-label: label text
          other-label: label text
        subcategory: some subcategory
        desc: 'Some description.

          '
        varlociraptor:
        - present
        - somatic_tumor_high
        - somatic_tumor_medium
        filter:
        - impact_filter
        - gene_list_filter
        sort:
        - binned max vaf
        - impact
        - revel
remove_duplicates:
  activate: true
calc_consensus_reads:
  activate: false
population:
  db:
    activate: false
    path: '...'
    alias: tumor
    fdr: 0.05
    events:
    - somatic_tumor_high
    - somatic_tumor_medium
annotations:
  vcfs:
    activate: true
    known: resources/variation.vcf.gz
  dgidb:
    activate: false
    datasources:
    - DrugBank
  vep:
    candidate_calls:
      params: --af_gnomade
      plugins: []
    final_calls:
      params: --everything --check_existing
      plugins:
      - LoFtool
      - REVEL
      score_versions: null
tables:
  activate: false
  output:
    annotation_fields:
    - EXON
    event_prob: true
    observations: true
  generate_excel: true
params:
  fastp: ''
  picard:
    MarkDuplicates: --VALIDATION_STRINGENCY LENIENT
  gatk:
    BaseRecalibrator: ''
    applyBQSR: ''
  varlociraptor:
    call: ''
    preprocess: --max-depth 200
  delly: ''
  freebayes:
    min_alternate_fraction: 0.05
    extra: ''
  get_sra:
    extra: ''
custom_alignment_properties:
  activate: false
  column: panel
  tsv: config/alignment_properties.tsv
